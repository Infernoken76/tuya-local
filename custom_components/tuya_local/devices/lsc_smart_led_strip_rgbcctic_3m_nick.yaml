name: LSC Smart LED Strip RGBCCTIC 3M Nick
products:
  - id: a5mzajl6cinrnfwi
    manufacturer: LSC
    model: Smart Led strip RGBCCTIC 3M
    model_id: 6125000800

entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 21
        type: string
        name: color_mode
        mapping:
          - dps_val: white
            value: color_temp
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
      - id: 22
        name: brightness
        type: integer
        optional: true
        range:
          min: 10
          max: 1000
        mapping:
          - dps_val: null
            value: 0
      - id: 23
        name: color_temp
        type: integer
        optional: true
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500
      - id: 24
        name: rgbhsv
        type: hex
        optional: true
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
      - id: 27
        name: music_data
        type: hex
        optional: true
      - id: 52
        name: dreamlight_music_data
        type: string
        optional: true

  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        name: second
        type: integer
        optional: true
        range:
          min: 0
          max: 86400

  - entity: select
    name: Color mode
    icon: "mdi:palette"
    category: config
    dps:
      - id: 21
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: colour
            value: Color
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
          - dps_val: white
            value: White

